# 웹 데모를 GitHub Pages로 자동 배포.
# 사용법: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정하면
# 이 브랜치에 push될 때마다 https://<계정>.github.io/-/ 에 배포된다.
# (아티팩트 데모와 달리 실제 지도 타일과 현재 위치가 전부 동작한다)
name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main, claude/japan-beggar-map-app-jkmwh8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Set base URL for repo subpath
        working-directory: mobile
        run: |
          jq '.expo.experiments.baseUrl = "/-"' app.json > app.json.tmp
          mv app.json.tmp app.json
      - name: Export web build
        working-directory: mobile
        run: CI=1 npx expo export --platform web
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
